[package]
name = "ford"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Lightweight SSH port forwarding with supervised sessions"

[dependencies]
clap = { version = "4.5", default-features = false, features = ["std", "help", "usage", "error-context", "derive"] }
getrandom = "0.3"
nix = { version = "0.30", features = ["process", "signal", "user", "socket", "poll", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
rustix = { version = "1.1", features = ["process"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = "debuginfo"
